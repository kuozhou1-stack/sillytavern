# {{valoran_variables}}
---
变量更新规则:
  通用约定: |-
    依据本轮事实、当前状态及连续生活依据，只更新变化的具体路径；玩家档案按其明确修改要求或实际变化修订、清空，身份与历史保持连贯。id由程序分配后稳定复用，改名不改id；null表示未知，明确的“无”、0、false和空集合不当缺失，不臆填未知值。
    计划、浏览资料不等于执行；当前行动只写已经开始的事。关联的状态、记录和收支同批结算一次，失败的尝试也按实际耗时与消耗记录。下划线开头的固定字段及其子字段只读，字典记录id不受此限。
    提示词投影省略的缓存、旧原文和未展开资料仍在存档；地点、组织仅名称不代表其他字段为空。不得用投影覆盖状态、角色/地点/组织记录或历史容器；按具体路径增改，资料加载由程序维护，引用和归档来源按本次提供内容使用。
    下列类型描述保存后的字段，不是每轮填写清单。新增认知记实际来源，性质变化须有新依据。
  公共类型定义: |-
    type 时间点 = { 年: number; 月: number; 日: number; 时: number; 分: number; } | null;
    type 生活 = { 住处id: string | null; 工作地点id: (string)[]; 常去地点id: (string)[]; 日常活动: string | null; 联系方式: (string)[]; 目标: { [id: string]: { 内容: string | null; 进展: string | null; }; }; 约定: (string)[]; };
    type 信息来源 = { 方式: "观察" | "听说" | "阅读" | "被告知" | "玩家填写" | "授权生成" | "导入" | "事件" | "未设定"; 说明: string | null; 人物id: string | null; 记录id: string | null; 获得时间: 时间点; };
    type 来源索引 = { [id: string]: 信息来源; };
    type 认知事项 = { 内容: string | null; 性质: "事实" | "推测" | "误解" | "未确认"; 来源: 信息来源; 对象id: string | null; 分享范围: string | null; };
    type 重要经历 = { [id: string]: { 日期说明: string | null; 日期精度: "日" | "月" | "年" | "未知"; 经历: string | null; 来源事件id: (string)[]; 来源存档id: string | null; }; };
    type 经历摘要 = { 起始日期说明: string | null; 结束日期说明: string | null; 经历: string | null; 覆盖记录id: (string)[]; 重要事项id: (string)[]; 来源存档id: string | null; };
    type 内容块 = { 类型: "文字"; id: string; 正文: string; } | { 类型: "图片"; id: string; 图片描述: string; 拍摄时间: 时间点; } | { 类型: "语音"; id: string; 转写文字: string; 语气描述: string | null; 模拟时长秒: number | null; } | { 类型: "表情"; id: string; 表情内容: string; } | { 类型: "视频"; id: string; 画面过程描述: string; 字幕或声音描述: string | null; 模拟时长秒: number | null; } | { 类型: "位置"; id: string; 地点id: string; 显示名称: string | null; 附言: string | null; } | { 类型: "名片"; id: string; 账号id: string; 附言: string | null; } | { 类型: "分享"; id: string; 目标类型: "帖子" | "消息" | "地点"; 目标id: string; 附言: string | null; };
  奇遇系统:
    任务:
      type: '{ [id: string]: { 名称: string; 类型: "日常" | "探索" | "社交" | "成长" | "奇遇"; 难度: "基础" | "进阶" | "稀有"; 目标: string; 有效日: string | null; 进度: number; 进展说明: string | null; 完成依据事件id: (string)[]; }; }'
      check:
        - 未开启时保持空集合；启用、接取、放弃、领奖、币额和购买由程序管理。
        - 日常任务由程序按故事日期发布；可据已知故事新增探索、社交、成长或奇遇任务，进度0、完成依据空。可接取最多8项，不代替玩家选择。
        - 已接取任务只改进度、进展说明、完成依据事件id；不改目标等定义，不删除或重结已领取/已放弃任务，过期不补奖。
        - 进展来自接取后实际行动；完成依据须为接取后新发生、含玩家且事实明确的事件。缺证保留未完成，不复用往事或把声明当结果。
        - 商店目录、价格、限购、效果及购买所得由程序提供，普通结算不得改写或增发。按各商品原描述结算生效方式、消耗条件及持续时间；耐用品与长期生效物品不统一当作一次性消耗品，实际使用与效果记相应事件。
        - 目标存任务说明，进展说明只写实际新进展；百分比依事实更新，不因整理重置。
  世界:
    基础信息:
      type: '{ 国家: string | null; 城市id: string; 城市名称: string; 时区: "Asia/Shanghai"; }'
      check:
        - 本处是城市名称的权威值；仅明确管理修改时修订，不随场景或角色导入改名。
    当前时间:
      type: 时间点
      format: "{年: 整数, 月: 1–12, 日: 本月有效日, 时: 0–23, 分: 0–59}"
      check:
        - 起点未知时保留null；有确认时钟后，按实际故事耗时提交完整五项合法公历对象，跨日/月/年按历法计算，不单独delta分钟。
        - 现实API耗时、浏览、刷新、管理及归档不推进时钟；经过需玩家决定的约定或场景节点前先停下。
    开局时间:
      type: 时间点
      check:
        - 保存最初确认的故事起点，未知为null；行动推进、导入和重新打开不改变此值。
    片区:
      type: "{ [id: string]: { 名称: string | null; 功能: string | null; 方位: string | null; 地图中心: { x: number | null; y: number | null; }; }; }"
      check:
        - 保留既有片区身份、功能及布局；地点引用正确片区，改名不改id。
    天气:
      type: "{ 天气状况: string | null; 气温: number | null; 风况: string | null; 适用区域: string | null; 生效时间: 时间点; }"
      check:
        - 首次涉及且天气未知时，结合已知季节、区域和场景建立天气；已有天气连续变化，不固定补晴天。日期未知不推定季节或伪造时钟，无依据的细节留null。
        - 距上次检查180分钟、跨日、明确变化或无锚点时检查；天气未变不写。本轮天气改变时程序取轮末为生效时间；正文明确是其他时刻才另写。
        - 保存正文天气及当前适用区域；预报、室内空调不覆盖室外实况，不在此存多区域历史。
    当前场景:
      type: "{ 场景id: string | null; 在场人物: (string)[]; 正在进行的事: string | null; 环境状态: string | null; 未完事项: { [id: string]: { 内容: string | null; 关联约定id: string | null; }; }; }"
      check:
        - 接续现场正在进行的事、环境和未完事项；切换手机不清空，长期目标和正式约定用引用。
        - 在场人物须与实际地点相容，同楼不同房不算在场；不把地点关联人物或匿名路人全部列入。
        - 场景不另存玩家位置；实际事件同步更新玩家或角色自己的地点，程序覆盖时间不由模型填写。
        - 首次涉及可建立未设定的环境、公共细节及必要小地点，保持已知布局；不据此补写玩家行动或既往经历。
    城市日程:
      type: "{ [id: string]: { 名称: string | null; 类型: string | null; 起始时间: 时间点; 结束时间: 时间点; 地点id: string | null; 适用范围: string | null; 公开信息: string | null; }; }"
      check:
        - 仅保存涉及故事的公开活动及其地点、起止时间、范围和内容，不强制每日热点，不由星期臆造现实假期，不维护获知来源。
        - 个人邀约写约定，已发生事实写事件；公开可查询不等于所有人已经知情。
    天气预报:
      type: "{ [id: string]: { 预测内容: string | null; 起始时间: 时间点; 结束时间: 时间点; 发布时间: 时间点; 适用范围: string | null; }; }"
      check:
        - 仅在故事涉及公开预报时保存预测内容、适用范围与时段；不模拟全城预报，不维护获知来源。预报不覆盖实际天气，没有预报则为空。
    异常入侵度:
      type: number | null
      range: 0～100
      check:
        - 按常驻异常入侵阶段判定；仅确认的入侵扩展、领域外溢、地区失守、来源阻断、威胁清除或安全恢复才调整，允许不变，局部处置不使整体清零。开局未知留null，不按轮次或耗时增减。
        - 入侵、调查、处置与恢复的新事实复用现有事件id接续；现场影响写当前场景，通行、营业、入口或残留危害写相应地点的动态状态及已知生效区间，解除后据实更新，不因离开现场或整体数值不变而丢失。
        - 同步实际受影响人物的状态、生活安排、目标、经历与约定；组织响应记事件和相关人物行动，不用临时出勤改写组织原始规则。实际发布、发送的通告和联络才写手机原文与对应可知来源，不把后台威胁自动变成玩家已知。
  玩家:
    年龄:
      type: number | null
      check:
        - 按通用约定修订。
    背景:
      type: "{ 成长背景: string | null; 家庭背景: string | null; 教育经历: string | null; 重要过往: string | null; 当前生活背景: string | null; }"
      check:
        - 按通用约定修订。
    身份:
      type: "{ 身份: string | null; 社会身份: string | null; 工作或就读单位: string | null; 组织id: (string)[]; }"
      check:
        - 实际身份变化时分别更新身份、社会身份、单位与组织引用。
    外貌:
      type: "{ 身高: number | null; 体重: number | null; 体型: string | null; 面容: string | null; 发型: string | null; 显著特征: string | null; 整体外貌描述: string | null; }"
      check:
        - 按通用约定修订。
    当前状态:
      type: "{ 当前地点id: string | null; 正在进行的行动: string | null; 今日穿搭: string | null; 身体状态: string | null; 饱食度: number | null; 水分值: number | null; 体力值: number | null; }"
      check:
        - 根据已选择且确实发生的行动更新位置、穿搭和身体事实，出发意图不等于抵达；不替玩家判定心情。
        - 三项数值范围0～100或null，沿用已有值，未知不补0或100；有实际耗时、消耗、进食、饮水或休息时据实更新，身体状态与物品消耗同步提交。
    生活:
      type: 生活
      check:
        - 居住、工作、联系方式均引用现有地点和账号；目标仅保存玩家表达，约定引用统一记录，不安排未选择的生活。
    技能栏:
      type: "{ [id: string]: { 名称: string | null; 品质: string | null; 描述: string | null; }; }"
      check:
        - 记录已掌握技能，按玩家明确设定或实际学习、训练、使用结果修订，同一技能复用原id。
        - 品质与描述沿用既定内容，只根据实际掌握或能力变化更新；未知字段留null、未确定技能留空集合。
    已知信息:
      type: "{ 已认识人物: { [id: string]: { 称呼: string | null; 已知资料: string | null; 上次已知地点id: string | null; 位置获知时间: 时间点; 已明确不在场: boolean; 来源: 信息来源; }; }; 已知地点: 来源索引; 已知账号: 来源索引; 获知事项: { [id: string]: 认知事项; }; }"
      check:
        - 实际观察、阅读、听说或被告知才加入，保留来源、获得时间与事实/推测/误解区别。
        - 玩家再次获知位置才改位置或获知时间；仍同场不等于本轮重新确认，不逐人刷新时钟。获知位置和获知资料可以在不同时刻；超过30分钟或明确离场仍可保留旧线索。
        - 地图标点仅来自已知地点；公共地点也须实际查询、阅读、到访或被告知才登记，玩家明确提供已知地址可记玩家填写来源。不自动登记全部公共地标或角色住址。
    个人记录:
      type: "{ 个人备忘: { [id: string]: { 内容: string | null; 关联事项id: (string)[]; }; }; 重要经历: 重要经历; }"
      check:
        - 个人备忘来自玩家表达。重要经历简记实际事件中对玩家有意义的决定、见闻或影响。用id关联约定或事务，目标进度在对应目标中维护。
    物品栏:
      type: |-
        {
          [id: string]: { 名称: string | null; 类别: string | null; 单位: string | null; 描述: string | null; 状态: string | null; 数量: number | null; 所有者id: string | null; 持有人id: string | null; 存放地点id: string | null; 获得时间: 时间点; 关联事项id: (string)[]; };
        }
      check:
        - 实际取得、消耗、赠送、转交、借还或丢失才变化；同名不同属性不自动堆叠。
        - 类别按常驻物品分类填写；旧记录类别不明确时保留原资料，不臆定消耗属性。
        - 玩家选择使用且行动确实完成时，消耗品按本次实际用量扣数量；耗尽后从可用物品栏移除，堆叠未用部分保留，历史取得与使用记录不删除。
        - 非消耗品不因使用扣数或删除；数量或类别未知保留未知，不猜测用尽。
        - 默认随身物品不填所有者id、持有人id、存放地点id；借入、借出、寄存或转交时填写例外，同一物品复用id，数量非负。
        - 实际购买的付款、所得物与交易事件同批提出；仅看见或想买不算取得，交易未成按实际收付款和取得结果处理。
        - 同一次使用的物品消耗、身体状态及事件一并提出，事件.关联记录id包含本物品id；可新建普通消耗事件或补充正在进行的同一事件，不为通过校验重复建事件，重试不重复扣减；数量已为0的消耗品不能再次使用。
        - 获得时间只记一份，可未知；取得和使用依据写事件并按需引用，不维护完整来源及独立当前可用布尔值，物品状态用文字说明。
    资金:
      交易:
        type: '{ [id: string]: { 事件id: string | null; 时间: 时间点; 类型: "收入" | "支出" | "内部转账" | "退款"; 金额分: number | null; 对方id: string | null; 用途: string | null; 状态: "待结" | "已完成" | "取消"; }; }'
        check:
          - 真实收支才建立，类型为收入、支出或退款，金额分为非负整数；旧内部转账仅作为历史保留，不建立新转账。
          - 同一交易id重试不重复扣款，已完成交易必须有对应事件；询价和未确认订单留待结，金额未知不确认支付成功。
          - 与金币总余额、物品及事件一并提交，保留原文账本，程序提交id不由模型填写。
      未结事项:
        type: '{ [id: string]: { 类型: string | null; 金额分: number | null; 对方id: string | null; 条件: string | null; 状态: "未结" | "已结" | "取消"; 关联交易id: (string)[]; }; }'
        check:
          - 仅有实际借款、欠款、待退款、应收应付时建立，保存对象、金额与条件；实际清偿或取消才改状态，并引用对应交易。不计入当前金币余额，不再另存获知来源。
      余额分:
        type: number | null
        check:
          - 余额分按百分之一金币的非负整数结算，未知留null；不拆分账户或建立内部转账。
          - 实际已完成收入及退款增加，支出减少；与新增完成交易及事件同次提交，未结事项不计入现有余额。总额未知时不按零计算，不靠历史流水反推初始资产。
    ${基础文字字段}:
      字段:
        - id
        - 姓名
        - 种族
        - 称呼
        - 性别
      check:
        - 按通用约定修订。
  角色:
    type: |-
      {
        [id: string]: {
          姓名: string | null;
          性别: string | null;
          种族: string | null;
          当前形态: string | null;
          年龄: number | null;
          身份: string | null;
          组织id: (string)[];
          简介: string | null;
          关系网: {
            [id: string]: { 姓名: string | null; 好感度: number | null; 信任度: number | null; 关系: string | null; 关系备注: string | null; 来源事件id: (string)[]; 当前定位: string | null; 防御姿态: string | null; 破壁阶段: number | null; 已知私密: (string)[]; };
          };
          认知: { [id: string]: 认知事项; };
          当前状态: string | null;
          当前地点id: string | null;
          生活: 生活;
          重要记录: { [id: string]: { 内容: string | null; 事件id: string | null; 约定id: string | null; }; };
          专属标识: { 身体印记: (string)[]; 随身信物: (string)[]; 感官特征: string | null; 破防弱点: string | null; };
        } & ({
          层级: "主要";
          外貌: { 身高: number | null; 体重: number | null; 整体体型: string | null; 三围信息?: { 胸围: number | null; 腰围: number | null; 臀围: number | null; }; 罩杯?: string | null; 详细外表: string | null; 今日穿搭: string | null; };
          性格: { 里性格: string | null; 表性格: string | null; 爱好: string | null; 厌恶: string | null; 小习惯: string | null; 语言习惯: string | null; };
          即时状态: { 心境基调: string | null; 生理状态: string | null; 注意力重心: string | null; };
          网络倾向: { [id: string]: { 网络身份: string | null; 常用平台: string | null; 发布偏好: string | null; 活跃习惯: string | null; 互动风格: string | null; 公开边界: string | null; }; };
          性特征适用: boolean | null;
          性特征?: { 奶子信息: string | null; 蜜穴信息: string | null; 其他: string | null; 性经验: { 性次数: { 确数: number | null; 概数说明: string | null; 已知新增说明: string | null; }; 性人群: string | null; 依据事件id: (string)[]; }; };
          经历: { 人生经历: 重要经历; 最近经历: 重要经历; 生活摘要: { [id: string]: 经历摘要; }; 阶段概述: { [id: string]: 经历摘要; }; };
        } | { 层级: "次要"; 外貌: { 身高: number | null; 体重: number | null; 整体体型: string | null; 详细外表: string | null; 今日穿搭: string | null; }; 性格: string | null; });
      }
    check:
      - 人物id为record键，同名不同id不合并；只更新本轮相关或生活检查覆盖的人物。导入、删除、升格限授权管理任务；移除不抹去他人关系和历史，不因被提及重建档案。
      - 未出场的已启用人物正常生活；手动关闭不维护、不补写停用期间经历，恢复从当前时点继续。自动轮换恢复由程序取回快照，再按本次生活检查接续最后记录至本轮结束。停用本身不作剧情解释，不清除历史或自动结算约定。
      - 次要人物用简表、外貌、专属标识和字符串性格。此刻的行动写当前状态，持续近况写重要记录.npc_current_state，不互抄；有意义的个人经历补入npc_history并保留旧要点。网络往来或实践有变化才写npc_online_habits、current_practice及相应引用。不添加主要人物专用结构，匿名路人不强制建档。
      - 实际形态变化只更新当前形态；种族、身份或能力另有变化依据才改，未知留null。
      - 关系网按对象人物id索引，对玩家也只存一份；姓名读取档案，仅外部或已移除对象可留姓名快照。好感与信任范围-100～100或null，分别按互动与经历更新；普通影响通常±1～3、重要事件±4～10，重大变化须有连续事件依据，允许不变。
      - 当前定位、防御姿态、破壁阶段依本次实际关系事实更新；破壁阶段为0～5整数或null，按常驻阶段定义判定，旧越界值转null，不机械进阶。关系备注保存共同经历、主观看法、托付范围与未了事项。
      - 认知保存来源、时间及性质；已知私密按常驻方向在对象实际获知时增补，不因降阶删除。对象为可更新角色时同步其认知，为玩家时写玩家.已知信息.获知事项，不为外部对象自动建档。专属标识只按确认资料或实际变化修订。个人目标与重要记录不另造获知来源，社交交集从共同事件读取。
      - 普通进展在最能承接下轮的位置记一次。答应明早代班写安排，到岗才改当前状态，久站后腿酸才改生理状态。用一句具体变化，不把同一动作改写成心境、注意力、关系备注或目标进展。
      - 当前状态记轮末行动，目标进展记已达成的阶段或阻碍。另有地点、穿搭、关系、认知等独立变化时照常更新；约定、联系方式引用对应id。网络倾向按通用、平台或账号记录。
      - 男性主要人物与全部次要人物省略性特征，男性主要人物同时省略三围信息与罩杯。主要人物性特征适用=false优先；非男性且明确true、或女性且未明确false时保留适用结构，其他情况不套模板或擅改标记。未知内容留null，新增可适用字段用insert。
      - 性次数按有依据的完整经历计一次，不按动作、气泡或人数拆次；旧总数未知仍为null，可记已知新增并用事件id去重。性人群描述已有对象，不推断未来意愿；日常不补造未发生的隐私与历史。
      - 值得接续的个人见闻、决定或影响，主要人物写经历.最近经历，次要人物写npc_history，不必等结束、数值变化、满五轮或玩家参与。
      - 共同经过记在事件，个人经历引用事件id，简记对本人的影响；仅在场不写个人经历。未归档的同一件事沿用经历id，保留起因、重要经过、结果及未解事项。归档后有新进展另建近期段并引用旧事件或摘要。
      - 后台生活在本次覆盖区间按常驻自主生活规则接续，不必等正文先描述；已有事实不倒改，固定外貌、性格、网络倾向不因调度重写。未知日期不编造日历或时长，认知仅在实际获知时同步。
      - 主要人物按配置轮数（默认5轮）、跨日、相遇或约定节点检查；次要人物按事件和待办检查。每个调度目标从上次检查接续到本轮结束，写实际进展；短区间可以只推进原活动。同次重试只补未存进展，记录空白先查摘要。停用或页面闲置不自行推进。
      - 经历日期保留实际精度，日精度用YYYY年MM月DD日、显示年月日-经历；摘要显示实际起止年月日-年月日：经历，不以生成日代替覆盖日，导入经历不冒充本世界已发生。
      - 先保存有意义的新进展，再于满10条或跨日提出覆盖id明确的摘要；同一活动后续沿用身份和引用，避免重复记账。生活细摘要保留7段（目标150～300字）、阶段概述4段（每段600字内）；保存成功前保留原文，超出交程序待处理，不硬删重要人生事件或有效约定。
  地点:
    type: |-
      {
        [id: string]: {
          名称: string | null;
          片区id: string | null;
          上级地点id: string | null;
          类型: string | null;
          简介: string | null;
          室内外: "室内" | "室外" | "混合" | "未知";
          地图位置: { x: number | null; y: number | null; 精度: "地点" | "片区" | "未知"; };
          常规开放时间: string | null;
          进入条件: string | null;
          动态状态: { [id: string]: { 说明: string | null; 生效时间: 时间点; 结束时间: 时间点; }; };
          关联人物: { [id: string]: string | null; };
        };
      }
    check:
      - 新地点先查重复身份并复用id，引用正确片区；上级地点区分楼宇与房间，未知地址保留null或片区精度。
      - 地图位置.x/y为1000×700世界坐标，精确地点须在所属地区世界范围内；按提供公式换算局部坐标，不默认片区中心，不为新地点或排版移动既有点位。同楼可共坐标，地点id及上级引用仍独立；真实移动依事件更新。
      - 开放条件沿用既定资料，动态状态仅存说明及生效区间；关联人物不等于在场，地点存在或坐标已知不授予进入权限。
  约定:
    type: |-
      {
        [id: string]: {
          参与者: { [id: string]: { 称呼: string | null; 响应: "拟议" | "待确认" | "接受" | "拒绝" | "取消"; 响应时间: 时间点; }; };
          内容: string | null;
          时间: 时间点;
          时间说明: string | null;
          地点id: string | null;
          状态: "拟议" | "待确认" | "已确认" | "完成" | "取消" | "未履行";
          履行依据事件id: (string)[];
        };
      }
    check:
      - 共享稳定id，保留参与者各自实际响应及响应时间，不再为约定及每个参与者重复登记获知来源。提议或未回应不得写成已确认，改期保留各方实际回应。
      - 时间地点未定留null和说明；完成、取消、未履行须有实际事实或事件依据，到时不自动结算。人物和手机只存引用。
  事件:
    type: "{ [id: string]: { 起始时间: 时间点; 结束时间: 时间点; 日期说明: string | null; 参与者: { [id: string]: string | null; }; 事实: string | null; 各人可知来源: 来源索引; 关联记录id: (string)[]; 更正自事件id: string | null; }; }"
    check:
      - 事件记录需追踪的已发生事实及消费、物品使用等结算依据，注明起止、参与者和各人可知来源。同一事件有新参与者或原参与者的作用改变时更新该项。有人新获知情况、得到新来源或确认获知时间更正时才更新其来源。已记录的人仍在场，沿用其原记录和获知时间。普通结算事件不必进入个人经历。计划写约定。
      - 同一事件复用id，持续活动有新事实时补充，不按回复拆分；不复制正文或重复结算。纠错引用原事件，不抹掉历史。
  组织:
    type: "{ [id: string]: { 名称: string | null; 类型: string | null; 简介: string | null; 场所id: (string)[]; 已知成员: { [id: string]: { 职务: string | null; }; }; 活动日程id: (string)[]; 规则: string | null; }; }"
    check:
      - 沿用确认的名称、类型、简介和规则；新组织依实际剧情建立，成员、职务、日程和场所引用依事实增改，不预填未知成员。
      - 完整说明存规则、简介存概述；共享场所或合作不合并组织id及成员身份，资料内容不等于人物已知。
  手机:
    账号:
      type: '{ [id: string]: { 人物id: string | null; 平台: "邻信" | "微澜"; 账号名: string | null; 昵称: string | null; 头像资源: string | null; 简介: string | null; 公开资料: { [id: string]: string | null; }; }; }'
      check:
        - 按人物与平台引用，账号名、昵称、头像和公开简介只在此维护；公开资料仅含本人公开的内容，不从完整人设泄露真实身份。
        - 邻信默认每人一账号，微澜按需要设置账号，不默认人人小号；玩家账号由其人物id查找，联系方式使用账号id引用。
    联系人:
      type: '{ [id: string]: { 本人账号id: string | null; 对方账号id: string | null; 备注: string | null; 免打扰: boolean; 状态: "正常" | "移除"; 建立时间: 时间点; }; }'
      check:
        - 初始交换或申请接受才建立，导入/评论/关注/升格不直接添加；备注、免打扰和移除采用实际选择。
        - 移除不删旧记录，单纯列表管理不自动改关系。
    申请:
      type: '{ [id: string]: { 发起账号id: string | null; 目标账号id: string | null; 说明: string | null; 时间: 时间点; 状态: "待处理" | "接受" | "拒绝" | "撤销"; }; }'
      check:
        - 保存发起人、目标、申请说明、时间和处理状态；接受、拒绝、撤销由相应当事人实际行动成立，未回应留待处理，不重复保存完整获知来源。
    关注:
      type: "{ [id: string]: { 关注者账号id: string | null; 被关注账号id: string | null; 建立时间: 时间点; }; }"
      check:
        - 有实际关注/取消才变化，是单向网络关系，不等于聊天联系人或好友。
    群:
      type: "{ [id: string]: { 名称: string | null; 头像资源: string | null; 创建者账号id: string | null; 公告: string | null; 成员: { [id: string]: { 群昵称: string | null; 成员区间: { [id: string]: { 加入时间: 时间点; 离开时间: 时间点; }; }; }; }; }; }"
      check:
        - 成员按账号保存加入与离开区间，重复加入保留多个区间；不补发未加入/缺席时段的历史，旧片段须以新转发消息获知。
        - 创建至少玩家及一名联系人；成员变动按实际邀请、加入、移除或退出记录，邀请不等于已经接受。
    会话:
      type: '{ [id: string]: { 类型: "私聊" | "群聊"; 参与账号id: (string)[]; 群id: string | null; 重要事项id: (string)[]; }; }'
      check:
        - 私聊统一邻信，参与账号与群引用准确；重要事项引用约定/事件，不重复保存原文。
        - 近期窗口及归档索引由程序维护；不生成等待提示、失败提示作为人物消息。
    原文:
      消息:
        type: "{ [id: string]: { 会话id: string | null; 发送账号id: string | null; 发送者称呼: string | null; 故事时间: 时间点; 内容块: (内容块)[]; 回复目标消息id: string | null; 撤回时间: 时间点; }; }"
        check:
          - 只记录真实发送内容、发送者、时间与回复目标，内容块按作者顺序，图片和附言可属同一条；使用文字/图片/语音/表情/视频/位置/名片/分享指定结构。
          - 图片仅描述可见画面，拍摄时间未知保留null；语音视频用固定转写描述及模拟时长，不编造文件链接，不以媒体时长自动推进世界时钟。
          - 按会话参与账号与故事时间由程序投递；撤回自己的消息记撤回时间，不回滚对方已读和认知；原文归档后仍保留。
      帖子:
        type: |-
          {
            [id: string]: { 平台: "朋友圈" | "微澜"; 发布账号id: string | null; 发布者称呼: string | null; 故事时间: 时间点; 内容块: (内容块)[]; 地点id: string | null; 话题: (string)[]; 编辑版本: { [id: string]: { 时间: 时间点; 内容块: (内容块)[]; }; }; 编辑时间: 时间点; 删除时间: 时间点; };
          }
        check:
          - 朋友圈与微澜分别展示本平台尚未删除的动态；帖子和评论引用实际存在的账号与原帖。
          - 编辑保存版本和编辑时间，原始发布时间不变；删除不追删他人回复转发与已交付内容。
          - 依据网络倾向与生活事实生成，刷新允许零条且不推进时间，不生成未来内容，不重复发布相同事件。
      评论:
        type: '{ [id: string]: { 帖子id: string | null; 评论账号id: string | null; 评论者称呼: string | null; 故事时间: 时间点; 内容块: ({ 类型: "文字"; id: string; 正文: string; } | { 类型: "表情"; id: string; 表情内容: string; })[]; 回复目标评论id: string | null; }; }'
        check:
          - 仅文字/表情，回复目标id明确，保留发布者亲友圈真实对话，不人人回应玩家；归档与源帖删除不级联移除他人的评论。
      点赞:
        type: "{ [id: string]: { 账号id: string | null; 内容id: string | null; 时间: 时间点; }; }"
        check:
          - 仅保存实际点赞账号及对象，计数从明细派生；点赞不顶帖，不推导整套人设。
      转发:
        type: "{ [id: string]: { 账号id: string | null; 原帖id: string | null; 新帖id: string | null; 时间: 时间点; 附言: string | null; }; }"
        check:
          - 有实际转发才建立，引用原帖及新帖身份，不克隆他人档案；源帖移除时保留转发者内容与原标识。
    摘要:
      type: '{ [id: string]: { 来源类型: string | null; 来源id: string | null; 层级: "细摘要" | "阶段概述"; 起始时间: 时间点; 结束时间: 时间点; 内容: string | null; 覆盖记录id: (string)[]; 重要事项id: (string)[]; }; }'
      check:
        - 只在授权摘要任务中归纳指定原文及新增互动，覆盖id与起止可追溯，保留条件、未回应问题、约定和误解性质。旧帖新互动沿用原身份与发布时间，只归档新增部分。
        - 原文不删除，保存成功后程序才调整窗口；私聊20条/每批10条，群聊30/10，朋友圈全流20/5，微澜全流30/10。会话细摘要150～300字、动态批次200～400字，各流保留5段细摘要/3段阶段概述（每段600字内）；提交失败保留旧状态及待办。
# {{valoran_variables_end}}
