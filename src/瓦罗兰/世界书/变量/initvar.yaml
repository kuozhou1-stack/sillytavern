  lotus_hot_spring:
    名称: 莲华温泉
    片区id: ionia
    上级地点id: null
    类型: 山间魔法浴场
    简介: |-
      山间公开疗养浴场，提供泡浴、茶寮与按排期开放的音乐浴；白玉莲花核心溶洞经许可处理确认适用的残留附着污染，不替代驱魔、封闭通道或其他治疗。地图方位：西北林间的临水疗养台地。

      莲华温泉是艾欧尼亚既有山间浴场，为普通宾客提供公开的疗养与休息服务，也可以按条件接待需要专门恢复的人。浴场已有固定位置，玩家实际获知后才登记为已知地点并显示标点。知道浴场存在、获知路线、预约成功和实际到达是不同环节；山间交通与营业时段按已确认信息处理，公开营业不表示可以直接抵达。

      普通区域可以提供泡浴、休息、已安排的音乐浴与茶寮餐饮。具体项目根据身体结构、伤势、愿意接受的服务和当前设施判断，不以种族名称统一规定所有需求。夜间活动有实际排期时另行说明，不把日夜气氛变化当作两个不同世界或不同人物。

      月光茶与音乐帮助放松，魔法蒸汽依已有设施产生适用的恢复。记忆负担的主题改为缓解当下困扰和获得休息，不默认抹去记忆、改变人格、解除感情或使宾客遗忘危险。受伤者可需要多次照护、恢复时间和其他治疗，不保证重伤立即治愈。

      白玉莲花核心溶洞沿用本卡设施自设，访问和使用须许可。专门净化首先确认污染的附着对象、是否仍有来源、泉水或主持者是否确实能处理。适用的情形可包括已终止外来侵扰后的残留附着；未知诅咒、实体恶魔、黑雾和星光损伤不能仅凭“污染”两字纳入同一疗程。

      若源头仍在，先安排有有效手段者解除、封印或阻断。净化结束后检查残留及实际改善，未能清除的部分继续处理；泡浴不关闭远处通道、驱散全部敌人、复活死者或修复器械与建筑。

      通晓人性的林间动物服务沿用原卡趣味，实际动物、工作人员和宾客保持不同身份。服务可出现小动物协助照护、运送用品等生活细节，不把所有动物、瓦斯塔亚和灵物都编入员工名册。

      专门疗养与普通游客分开接待，保护伤情、身份和个人困扰。战后求助不自动授权进入所有私人浴区。设施、泉源、物资和通路受影响时会限流、暂停部分服务或撤离，温泉不保证世界崩溃时仍绝对安全。
