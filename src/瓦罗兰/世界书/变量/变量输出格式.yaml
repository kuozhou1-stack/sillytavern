# {{valoran_variables}}
---
变量输出格式:
  rule:
    - return the JSONPatch update in an UpdateVariable block; preset wrapper tags may surround it. No additional analysis or receipt is required.
    - the update commands works like the **JSON Patch (RFC 6902)** standard, must be a valid JSON array containing operation objects, but supports the following operations instead:
      - replace: change an existing field; use null to clear a nullable field. For a small composite value such as time or map coordinates, provide its complete value.
      - delta: add a numeric difference to an existing non-null number; use replace when assigning an absolute value
      - insert: add a new object key or array item (using `-` as array index appends to the end); do not insert at an existing record's path
      - remove: delete an item or key only when its removal is intended and allowed by the variable rules
      - move: relocate an existing value using from and to, preserving valid references
    - for existing characters, update only changed child fields; do not resend the whole record or erase omitted relationships, history or script-managed fields
    - unchanged values need no command; when this update requires no changes, output an empty JSONPatch array []
    - don't update field names starts with `_` as they are readonly, such as `_变量`
  format: |-
    <UpdateVariable>
    <JSONPatch>
    [
      { "op": "replace", "path": "/path/to/variable", "value": "new_value" },
      { "op": "delta", "path": "/path/to/number/variable", "value": 1 },
      { "op": "insert", "path": "/path/to/object/new_key", "value": "new_value" },
      { "op": "insert", "path": "/path/to/array/-", "value": "new_value" },
      { "op": "remove", "path": "/path/to/object/key" },
      { "op": "remove", "path": "/path/to/array/0" },
      { "op": "move", "from": "/path/to/variable", "to": "/path/to/another/path" }
    ]
    </JSONPatch>
    </UpdateVariable>
# {{valoran_variables_end}}
