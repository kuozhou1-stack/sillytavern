都永远无效。\n  恢复服务确认: 分别说明适用伤势、报价、所需资格和仍未恢复的部分；伤势没有处理不能因生命回满就自动消失。原著特殊药剂的强度上限和次数限制也不因返园而重置。\n  停留时间转换: 原著苏晓晋升二阶后完成首个衍生世界时，开启将现实停留时间最多一半置换为乐园停留时间的功能。这是已知开放案例，按本局实际授予资格和兑换条件办理；两地时间分别扣增，不重复领取，不为一阶新档自动开放。\n  防侵入与危险道具: 专属房间的保护由乐园公证维持，强大外来者不能只凭实力、定位媒介或一道传送门绕过许可闯入。原著堕落使徒利用交易躯体尝试定位乐园，定位失败，触须的减益被剥离，随后被轮回乐园锁定并处决；不能让正常园内道具鉴定突然变成无公证解释的强敌入室追杀。\n  人员与财物: 原著有爆炸被压缩消除、原罪波动时人员获得无敌护盾的实例，同时家具曾化为灰渣。人员安全、房间结构、随身因果与可损毁陈设分开，不把安全房理解成免费修复一切、抹除所有契约代价或无限复制实验材料。\n  精神休整与饮食: 高压任务后可存在警觉、疲劳、睡眠问题或情绪紧绷，程度因人和经历而异，不统一给契约者判定精神疾病。原著有餐馆、温泉洗浴及以美食放松的生活场景；休息、信任关系与个人习惯有实际价值。高阶食材的临时增益或永久收益需菜品本身有明确效果，不给每顿美食默认幸运加成，也不把某个戏称菜谱当通用原著配方。\n',Gg='强化大厅与设备:\n  属性强化大厅:\n    属性强化仓: 提供普通属性点分配和身体强化。仓位、分配方案和辅助服务由设备提供，部分服务有麻醉选项。\n    高等属性强化仓: 适配真实属性强化；在相关公证指引、服务开放或实际抵达后介绍，知晓设施不等于已获得使用资格。\n  技能升级大厅: 技能升级仓展示当前可提升的能力、条件与费用。\n  装备强化大厅:\n    设施概貌: 强化大厅常年弥漫着高温蒸汽、机油味与沉重的机械轰鸣，密密麻麻排列着钢铁巨兽般的装备强化机。\n    强化流程: 契约者将装备放置于金属托盘上，机械手臂合拢将其收入机器内部，伴随着高压气阀喷吐蒸汽、齿轮飞速咬合与红绿指示灯交替闪烁。绿灯亮起并伴随清脆提示音为强化成功；红灯长鸣、机械剧烈震颤甚至喷出黑烟则为强化失败。\n    风险梯度: 常规装备强化 +1 至 +7 成功率较高且失败代价相对可控（失败通常仅为强化等级清零或轻微掉级）；+8 及以上进入高危区间，失败将面临强化等级大幅倒退乃至装备直接碎裂爆毁、化作一堆废铁粉末的极端风险。成功率、失败清零、降级、损毁及保护材料作用随装备、等级和当前规则变化，不存在全品级通用的低等级绝对安全区。\n    契约者生态与怨念: 强化大厅内充斥着契约者强化成功的狂笑与装备碎裂后的撕心裂肺哀嚎；面对强化机的严苛概率，契约者群体中衍生出“垫子连碎法”、“转运符咒”、“祈祷玄学”等各类心理安慰手段，但强化机始终只遵循公证概率运转。\n  名称: 大厅是场所，仓或机器是设备；中心交易广场属于交易场所。\n  操作方案: 首次提供可执行方案时，明确对象、费用、材料、适用规则和必要奖池，说明风险与保护选项；相关成长收益的数值依据在确认前展示。缺少必要信息的方案只能视为待确认，不能直接执行。\n  强化感受与麻醉: 原著早期属性强化伴随明显剧痛，并明确提供免费麻醉；苏晓选择不启用，大部分契约者选择启用。关于影响强化效果应保留当时信息来源，不扩写成所有真正强者必不麻醉或自造额外意志奖励。\n  身体适应: 大幅强化后可能需要冥想、试炼或实操适应新的力量与速度，具体程度取决于增幅、经验和身体条件。属性已经提升与控制熟练度不同，适应不足应影响动作表现；不统一扣掉已到账属性，也不固定每人必须训练一至两小时才能生效。\n',Yg='储物与交易生活:\n  储蓄空间: 通过烙印存取符合条件的物品，具有容量与扩展服务；与房间陈设和当前穿戴分别管理。\n  物品资格: 持有、所有权、鉴定、使用、公证交易和跨世界带出资格各自独立。商品可供查看，购买完成前仍属于卖家。\n  公证交易: 保障约定资产的转移与交付，不保证估价合理、情报真实或条款没有陷阱。\n  中心交易广场: 展示战利品、寻找装备材料、比较报价和接触合作者的公共场所。\n  大聚地:\n    定位: 跨乐园的公开交易区域；原著有晋升九阶后开放权限的明确提示，可与其他乐园的契约者及特殊身份人员交易，主要使用灵魂钱币。\n    价值: 不同阵营擅长的生产、需求和供应形成跨阵营市场；一件在本方难售的物品，可能更适合其他阵营的能力者，但不存在固定跨阵营倒卖利润。\n    限制: 部分阵营特有物资不可交易，公开市场不等于解除绑定、出售限制或公证归属。抵达、交易资格、出售权限及跨世界运输分别确认，任务途中不能无条件随时往返。\n    区别: 大聚地与所属乐园的中心交易广场是不同地点；其他世界中同名的部落聚居地不因此具有跨乐园交易服务。一阶开局不会自动取得九阶市场的准入资格。\n  店铺与工坊: 职工者提供餐饮、生活用品、生产与委托加工；库存、能力与报价因经营者而异，采购活动受任务出发等供求变化影响。\n  初始配额: 开局配发一阶储物空间，容积上限1.0、负重上限50.0，依据为初始配额；后续可通过乐园付费扩容。\n  配额性质: 上述初始容量是本卡玩法数值，并非原著所有乐园统一配额；曙光分支须有对应的残留储物公证依据。\n  市场运行: 广场摊位、私人店铺、商会与拍卖有不同议价和成交方式。任务出发前的消耗品需求、稀缺材料、买方路线与卖方周转需求会影响报价，鉴定价格不等于必然成交价。\n  信息交易: 地图、攻略、敌人能力和材料产地可能过时、不完整或带有售卖者立场；收费情报仍须区分来源与可靠程度。买到地图不保证目的地无人占据。\n  委托加工: 客户自备材料、代购材料、加工费、交期与失败责任分别约定；工坊能力和公证合同决定交付，不能把展示中的成品视为已属于玩家。\n  日常关系: 餐饮、休息、训练约伴和长期委托可形成稳定交往，职工者也有成本、客源、性格与自己的经历。苏晓常去的店铺不因此自动给陌生玩家相同折扣或信任。\n  活体限制: 普通储存空间不能收纳活物，原著平头哥无法随武器一同被收入空间；活体容器、召唤空间或其他特殊能力须独立确认，不能用普通背包装走敌人、从者或原住民。\n  临时封禁: 特定试炼可封禁整个空间，也可仅封禁食物与淡水；物资仍可能存在但无法取用，不能以背包里有东西绕过当次生存条件。离开后是否解封按实际通知，不将临时限制永久删除为物品消失。\n  世界限定物品: 世界内可用、所有权、出售与带出资格分开。原著有帝具回归时折成世界之源、未获带出资格的材料被扣留、毒液付费认证带出等不同案例；有的物品即使取得所有权也只能本世界使用。返程逐件按已知说明处理，不一律没收、保留或折现。\n  商会生态: 黑帆商会、红枫等原著商会有各自渠道、库存与商业利益；黑商通过高风险世界供应、寄售和资源周转经营，不只是一句统一高价。报价取决于稀缺度、流动性、受众、信誉和关系，不因品级高就必有买家。\n  条例博弈: 凯撒的操作依赖裁决经历、能力、因果、公证身份及具体规则缝隙；合法谋利、越线违规与乐园处决条件分别核定。原著其他人模仿商会开盘受到惩罚，说明同样动作未必拥有相同资格；不能通过一句卡漏洞获得无限资金、凭空改公证或免除任何追索。\n  摆摊与匿名: 可通过实际服装、代号、容貌保护或场所提供的伪装降低被辨认风险，但黑袍不是全员强制制服，场外追踪也不会因穿上黑袍自动失效。摊位租赁、展示、公示价格、议价与私聊按当期市场设施办理。\n  鉴定与骗局: 已由乐园公证的品级、属性和商品资料不能被普通染色随意篡改。信息不全、未经鉴定的古物、隐含使用代价、低流动性物资、文字误导和场外诈骗仍可产生交易风险；眼力、知识与鉴定用于确认这些差异，不因智力高就自动透视全部隐藏条款。\n  交易街市与摊位生态:\n    摊位运作: 契约者支付少量乐园币即可租赁公共交易广场的摊位；摊位可由契约者本人亲自看守议价，也可设置无人售卖托盘进行全自动标价代售（契约者可离开或返回现实，收益直接转入烙印账户）。\n    市场黑话与群体: 市场上充斥着“扫货商/倒爷”（专门低价收购冷门极品或急于套现物资并转手高价卖出的中间商）、“黑商”（行事不择手段、真假情报混卖、高利借贷或专坑新人的投机商）、以及大冒险团的“专职采购员”（大批量溢价收购恢复品、硬通货材料与高级卷轴）。\n    议价规则: 标价不等于最终成交价，支持烙印私聊砍价、以物易物；但所有物品交付均通过乐园公证托盘完成，杜绝物理抢夺。\n';function Xg(e,t,l){const a=h.z.record(h.z.string(),h.z.unknown()).parse(Kg().parse(e)),n=h.z.record(h.z.string(),h.z.unknown()).parse(a[t]);return(Array.isArray(l)?l:[l]).flatMap(e=>{const t=h.z.union([h.z.string(),h.z.record(h.z.string(),h.z.string())]).parse(n[e]);return'string'==typeof t?[{label:e,text:t}]:Object.entries(t).map(([e,t])=>({label:e,text:t}))})}const Qg=[{id:'arena',name:'竞技场'
