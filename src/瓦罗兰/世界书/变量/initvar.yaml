    类型: 独立战斗学院
    简介: 杜朗德尔是独立的神之武器学院。课堂、年级、级长、战斗俱乐部、刺客俱乐部和博识俱乐部等学习与社团关系共同构成校园生活；具体社团成员和负责人依个人资料，不用校名为所有人指定性格。
    场所id:
      - university_university
    已知成员: {}
    活动日程id: []
    规则: |-
      杜朗德尔是独立的神之武器学院。课堂、年级、级长、战斗俱乐部、刺客俱乐部和博识俱乐部等学习与社团关系共同构成校园生活；具体社团成员和负责人依个人资料，不用校名为所有人指定性格。

      本卡保留其重视荣誉与秩序的校园风格，把它落实为课程承诺、训练记录、器材保管、赛事规则和履行职责。学生可以在遵守规则时追求自己的作品、恋爱和个人目标，学校不自动剥夺日常选择。

      神之武器搭档训练、个人科技与团队演练可以成为专业活动。先给出实际参与者、训练目标和已有器材，训练结果影响本次课程或赛事表现，不自动生成新武器、技能和永久战力等级。

      参与跨校活动时，杜朗德尔保留独立组织与学生归属。进入共享园区不会变更学籍，参加另一学校的公开社团展示也不等于加入该校。危机中的出勤、援助和撤离由实际知情、权限与能力决定，执行共同守护规则。
  labrys:
    名称: 莱布利斯学院
    类型: 独立战斗学院
    简介: 莱布利斯是独立的神之武器学院。其学生可以有不同教育经历、擅长方向和相处习惯，不能用“问题学生”把全校写成暴力团伙，也不能仅凭既有气质给每个学生添加违纪经历。
    场所id:
      - university_university
    已知成员: {}
    活动日程id: []
    规则: |-
      莱布利斯是独立的神之武器学院。其学生可以有不同教育经历、擅长方向和相处习惯，不能用“问题学生”把全校写成暴力团伙，也不能仅凭既有气质给每个学生添加违纪经历。

      本卡保留较自由、多样的校园氛围。纪律与个人尝试之间的摩擦落在具体课程、社团活动、训练安全和赛事准备上；学员可以提出不同训练方式，级长与教师需要说明限制和实际风险。自由不是无条件攻击同学或在公共地区试用危险武器的许可。

      博识和战斗等社团与本校教育事务分别管理。学生展示、啦啦活动、训练和跨校比赛提供普通社交机会。共同园区的宿舍和接驳设施可供获准人员使用，使用公共设施不消除寝室、研究和教学场所的权限。

      学院与其他守护者拥有保护居民的共同目标，实际出动依事件与人员条件。可以在救援、观察敌人行动和适用的防御工作中发挥作用；不因为风格自由就自动更强，也不将参加训练等同于外敌作战资格。
  babylon:
    名称: 巴比隆学院
    类型: 独立战斗学院
    简介: 巴比隆是独立的神之武器学院，具有自己的招生、社团、学生管理与跨校参赛安排。舞会、社团竞选、团队练习和赛事准备与日常课程并存，感情和友谊可以影响共同活动，不能只用“精英战术”代替校园生活。
    场所id:
      - university_university
    已知成员: {}
    活动日程id: []
    规则: |-
      巴比隆是独立的神之武器学院，具有自己的招生、社团、学生管理与跨校参赛安排。舞会、社团竞选、团队练习和赛事准备与日常课程并存，感情和友谊可以影响共同活动，不能只用“精英战术”代替校园生活。

      本卡保留重视小队配合的训练方向。活动可以围绕分工、路线、任务目标、撤离与赛后复盘组织；每个参与者使用已有能力和器材，计划失误产生本次训练后果，不凭学校名称给所有人增加潜行、读心或刺客能力。

      跨校赛事需要本校准备与团队磨合；其他学院可以是竞争者，也可以是日常朋友或项目合作者。比赛经历、恋情与任职依当前人物档案和实际事件，不由学校背景代填。

      共享园区为巴比隆提供接驳和获准共用的活动场所，学校的文件、内部课程和私人房间仍独立授权。危机应对按共同守护规则，不把这所学校固定成唯一负责秘密任务的部门，也不预设与所有地下组织相通。
  spirit_blossom_society:
    名称: 绽灵秘会
    类型: 隐秘协作组织
    简介: 绽灵秘会是本卡沿用的隐秘协作组织，保有与灵界、祭礼、执念和精神侵扰有关的知识。其保护居民、帮助受困者与处理适用的异常为共同职责；城市中的绽灵礼俗与灵界传说不由该组织统一管理。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      绽灵秘会是本卡沿用的隐秘协作组织，保有与灵界、祭礼、执念和精神侵扰有关的知识。其保护居民、帮助受困者与处理适用的异常为共同职责；城市中的绽灵礼俗与灵界传说不由该组织统一管理。

      文化活动与实际灵界事务分开。讲述地方传说、悼念亲友或参加绽灵礼俗，不等于与亡者真实交流；某位现实人物也不因对应皮肤便自动是传说中的灵物。明昼、夜幽等用词不能直接变成市民的善恶判定或战力等级。

      受惊、哀伤或反复梦境首先根据具体经历判断。发现外来精神侵扰时，由有相关手段的人识别附着、追查来源，选择驱除、解缚、击败或封印；解除侵扰后仍可需要谈心与疗养。普通安慰不能宣布实体恶魔消失，成员称号也不自动授予相同法术。

      与亚扎卡纳有关的事件可以按受影响者、滋生环境和既有识别手段调查。使用永恩知道真名并封入面具的手段时，须由拥有该能力的角色实际执行，不把这一手段扩成全体成员的基础技能。

      对外接触可以通过实际参与的文化活动、熟人介绍或当事人求助发生。公开活动叫什么、是否有固定联络人和与星守/学院是否互通暂不补定；不新增总部地图点，也不让资料中的成员称号成为公众已知名单。
  black_rose:
    名称: 黑色玫瑰
    类型: 秘密组织
    简介: 黑色玫瑰是本卡已有的隐秘组织，以长期布局、渗透、幻术和利益安排开展活动。公开社交、企业往来、个人关系与秘密成员身份分开；参加同一场宴会、使用玫瑰装饰或与成员认识，不自动证明加入组织。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      黑色玫瑰是本卡已有的隐秘组织，以长期布局、渗透、幻术和利益安排开展活动。公开社交、企业往来、个人关系与秘密成员身份分开；参加同一场宴会、使用玫瑰装饰或与成员认识，不自动证明加入组织。

      具体行动围绕一个实际目标展开，例如争取项目、获取某份档案、影响关键人物的决定或隐瞒一段合作。须写明可用渠道和阻力，不能用“操纵全城”跳过行动过程，也不让组织掌握所有私聊、房间和未知异空间。

      墒增可以成为某些行动者对宇宙局势的用词，社会猜忌、商业打压和谣言则用实际事件描述。一次谈判失败不会直接生成外敌；只有已有裂隙、受影响者或持续侵扰等条件出现时，才判断与其他危害的因果联系。

      组织的利益行动不等于所有成员都希望世界毁灭。它与虚空、暗星、星之吞噬者、地下商业势力的合作或敌对关系须有本卡明确依据；不同皮肤资料中同名人物的合作不能反向证明所有组织永久同盟。

      该组织存在危险性与秘密，但低阶段不要求每次商业接触都是陷阱。玩家可以遇到公开事务并逐步发现不一致的信息；未获知事实继续作为未知，拒绝涉入仍可能错过机会或面临已经发生的社会后果，不自动进入臣服路线。
  glasc_industries:
    名称: 戈拉斯克工业
    类型: 工业企业
    简介: 戈拉斯克工业是本卡既有的炼金科技企业。采购、生产、运输、设备维护、产品测试、访客接待和商业合作提供日常职场关系；实际产品与人员依已有档案和当前事件，不自动补出一整套军火目录、控制药剂或无限产能。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      戈拉斯克工业是本卡既有的炼金科技企业。采购、生产、运输、设备维护、产品测试、访客接待和商业合作提供日常职场关系；实际产品与人员依已有档案和当前事件，不自动补出一整套军火目录、控制药剂或无限产能。

      总部位于现有地图记录的诺克萨斯相关通商区域，保留地点id与坐标。祖安的炼金产业和合作背景可以通过人员、订单和货物流动联系总部，不为了迁就原作印象把地图点搬回祖安；这种地点安排是当前卡自设。

      企业地址与公开接待信息可以查询。进入办公室、实验室、仓库和内部资料需要对应邀请或工作权限；批准商业会谈不等于允许参观危险试验。企业成员不因此自动知道每名客户的隐藏组织和能力。

      事故应按实际源头分别处理：设备故障维修设备，泄漏先隔离并停止泄漏源，人员伤害安排适用的治疗，持续异常污染再寻求具有相关手段的人。宣传词、炼金术和普通产品不能替代所有净化法术或关闭虚空通道。

      危机中，企业可以提供实际拥有且愿意提供的物资与运输，也可能因资源、人员或自身利益限制合作。合作对象与秘密交易尚未定稿，不设与黑色玫瑰或所有守护者的永久联络。
  debonair_network:
    名称: 执事与地下商业网络
    类型: 商业关系网络（非统一组织）
    简介: 本条说明商业与地下社会的关系，不把“执事”建立为一个统一组织。酒店经营者、商业街业主、娱乐场所主持、安保、接待人员与商人可以在同一个社交圈活动，称号和服装不决定职业从属。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      本条说明商业与地下社会的关系，不把“执事”建立为一个统一组织。酒店经营者、商业街业主、娱乐场所主持、安保、接待人员与商人可以在同一个社交圈活动，称号和服装不决定职业从属。

      商业竞争用客源、场地、合同、口碑和具体财损呈现。宴会、会员活动、会议和住宿提供公开交往；同一酒店的顾客不自动属于某个家族或帮派。现有地图上的商务中心、酒店、度假设施和商贸街承接这些活动，不新增诺克斯维加斯市区或合并国家地图。

      少数交易可能涉及隐秘势力、来源可疑的灵药或超界之物。不同交易须分别说明双方、物品、承诺、代价和知情范围。皮肤主题资料中的“虚空”名称或超界力量不能单凭名称归入主世界虚空，地下生意也不全部属于黑色玫瑰。

      灵药属于地下交易中的特殊商品。成分、用途、售价、获得条件和副作用未明确的商品保持未知，不能仅凭名称编造效果，也不提前加入奇遇商店或发放能力。服用结果依该商品已确认作用与实际事件判断，不指定每次服用必招来同一种敌人。

      当异常交易影响普通居民，守护者可根据已知事实介入救援与源头处置。普通职员、顾客和艺人可以只是受影响者或目击者，无需全部成为卧底、帮派成员或敌人。
