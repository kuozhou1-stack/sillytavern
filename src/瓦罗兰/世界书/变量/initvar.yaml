  cutie_cafe:
    名称: 咖啡甜心
    片区id: oldtown
    上级地点id: null
    类型: 魔法咖啡厅
    简介: |-
      旧城迷途区公开营业的魔法咖啡馆，提供茶饮、魔法糕点、心情甜品和实际开放的可食花园；专门心灵恢复与结界庇护仅对确认适用的对象、范围和条件有效。地图方位：迷途旧街东侧的沿街店铺。

      咖啡甜心是旧城迷途区的公开魔法咖啡馆，坐落于既有迷途街角生活背景。店面和营业消息可以被正常了解，不再以纯善、命运或隐藏守护身份筛选全部顾客。店铺已有固定位置；玩家实际查询、被告知或到访后才登记为已知地点并显示标点。公开营业不表示每位来客都已知道具体路线。

      前厅提供茶饮、魔法糕点、等人和休息。厨房、员工休息处、专门服务区与核心设施需要相应许可。后花园沿用本卡可食植物的趣味设定，供实际开放活动使用；可食性依具体植物和顾客身体需求判断，不意味着庭院中任何东西都能随意拿取或入口。这些区域作为现有店内的空间说明，不新增地图点位或坐标。

      “心情甜品”根据顾客主动表达的偏好和店员实际观察推荐，顾客可以拒绝或换成普通菜单。不会自动读出隐藏创伤、替人决定治疗或以情绪变化强制下单。魔法糕点可以让实际食用者更有精神，茶饮与休息帮助安神；效果依已有制作能力和使用条件，不给所有店员同一种法术。

      专门服务可以处理设施或施术者已确认适用的轻度外来精神侵扰后的不适，或在实际维护的结界范围内提供短时防护。来访者须先说明困扰与已经发生的危险，店方确认能否接待；活动中的恶魔、持续诅咒、通道和重度未知污染先寻求适用的处置，不能靠吃甜品直接宣布源头消失。

      庇护范围只覆盖实际结界和有能力维持的区域，不能保证敌人永远找不到、隔绝所有跨界攻击或无限收容。员工、材料、设施和道路受损时可以缩减服务、暂停营业或组织撤离；最高阶段不能无视世界全面崩溃照常成为永久安全区。

      顾客买到服务与休息机会，不自动获得店员的联系方式、亲密关系或组织情报。所有者、店长、糕点师、接待和防卫人员依已有角色资料，不从皮肤简介重新任命。
