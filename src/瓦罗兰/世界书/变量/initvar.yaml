  university_university:
    名称: 悬空学院园区
    片区id: university
    上级地点id: null
    类型: 多校共享悬空园区
    简介: |-
      依靠既有反重力设施悬浮的多校园区与接驳入口，杜朗德尔、莱布利斯和巴比隆独立管理。共用入口与设施不合并学籍、校方或研究权限。地图方位：地区详细图北侧中央。

      悬空学院区分为地面文教生活与悬空园区。地面的符文书街和公共图书馆服务普通市民与师生，不要求学院学籍；进入悬空部分需要实际升降接驳与对应学校或活动许可。

      悬空学院园区点位承接多所独立学院共用的园区入口。杜朗德尔、莱布利斯与巴比隆各自管理教学、学生、社团和研究，共享入口不产生统一校长或三分院管理。获准进入园区之后，还要确认可以使用哪个活动区和设施。

      学生生活区保留原上级点位关系，提供当前安排的学生起居与交流空间。住宿、楼栋和私人寝室权限分开，不为了表现学校独立而新造三套宿舍地图点、强行分房或更改个人住处。

      神之武器礼堂是园区内既有仪式设施。具体活动是搭档确认、精神链接仪式和获准教学，由具有适用能力的人与已知神之武器实际进行。武器有自身意志，参与不等于获选；未获选也能结束本次活动，不将仪式变成统一派发能力的系统。

      共享公开展示、舞会和跨校赛事需要真实排期与参与安排。学校可在项目中合作或竞争，跨校参加不变更学籍、秘密任务和全部研究权限。其他学校存在时也按实际组织与已确认场所处理，不凭校名新增总部或入口。

      遭遇危险时，按实际位置与影响决定暂停接驳、保护在校者、疏散或组织有效人员援助。反重力设施是否受损、礼堂是否可用与谁已经撤离逐项判断；不能按阶段直接让全部学校坠落或指定人物死亡。
