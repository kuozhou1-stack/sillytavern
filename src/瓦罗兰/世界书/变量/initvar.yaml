    类型: 演艺团体
    简介: K/DA是以舞台表演、流行音乐与视觉创作见长的音乐组合。创作、编舞、排练、录音、宣传与巡演构成其日常工作。公开活动信息可被查询，排练、后台、私人聚会与休息安排仍有各自权限。艺人的职业名声不会使陌生人自动成为朋友、进入后台或获知秘密使命。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      K/DA是以舞台表演、流行音乐与视觉创作见长的音乐组合。创作、编舞、排练、录音、宣传与巡演构成其日常工作。公开活动信息可被查询，排练、后台、私人聚会与休息安排仍有各自权限。艺人的职业名声不会使陌生人自动成为朋友、进入后台或获知秘密使命。

      团队按项目与制作人员、演出场馆和其他艺人合作。同一人参与不同组合仍保留同一身份和经历，合作项目不自动合并团队，也不把特邀合作人变成永久成员。已有个人档案决定谁是成员、队长或合作人；本条不补名册。

      音乐可以鼓舞实际听众，使他们重新表达自己、面对挫折或愿意求助。需要魔法心灵净化时，须由已有相应能力的人或已确认的设施实施，写清覆盖的听众、介质和效果。作品传播、销量、点赞与快乐气氛本身不结算世界入侵度，也不赋予每名艺人净化能力。

      危机中的可用工作包括取消危险场次、通知观众、提供已获准使用的场馆和物资、协助受惊者恢复。具有守护身份的个人是否参与战斗按其既有设定和当时行程处理；舞台团队不会整体自动成为星守支队。
  true_damage:
    名称: 真实伤害
    类型: 演艺团体
    简介: 真实伤害是围绕嘻哈、电音和不同地域音乐共同创作的艺人合作团队。词作、制作、歌唱、现场演出与视觉设计可以由不同参与者负责；合作的目标是作品，不要求所有人属于同一个厂牌或拥有同一种能力。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      真实伤害是围绕嘻哈、电音和不同地域音乐共同创作的艺人合作团队。词作、制作、歌唱、现场演出与视觉设计可以由不同参与者负责；合作的目标是作品，不要求所有人属于同一个厂牌或拥有同一种能力。

      街头演出、小型场馆、新作试听和社区交流为其提供生活场景。商业合作可以增加资源，也可能与创作自主、同行竞争或原有街区关系发生摩擦；这些冲突用合同、排期、署名、报酬或具体作品争议呈现，不默认每次邀约都隐藏阴谋。

      公开曲目、采访与已公布的活动可以形成公众认知，私人合约、家庭经历和隐秘职责另有知情来源。地下音乐场所是演出地点；“地下”不直接说明成员违法、崇拜外敌或加入黑色玫瑰。

      歌曲可以帮助实际听众表达烦恼、找到同伴和恢复信心。魔法心灵净化遵循专门服务范围，不能通过“真实”这个主题强行揭露全部谎言、读心或清除远处诅咒。事故后可以通过慰问演出、筹措物资或协助信息传播支援居民，参与者保留接受、拒绝和退出活动的选择。
  heartsteel:
    名称: 心之钢
    类型: 演艺团体
    简介: 心之钢是重视自主创作的音乐团队，日常包括作曲、编曲、演唱、说唱、舞台设计、排练与发行准备。不同专业和想法可以在合作中磨合，意见不合先围绕作品和工作解决，不默认演变成成员背叛或人格失控。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      心之钢是重视自主创作的音乐团队，日常包括作曲、编曲、演唱、说唱、舞台设计、排练与发行准备。不同专业和想法可以在合作中磨合，意见不合先围绕作品和工作解决，不默认演变成成员背叛或人格失控。

      团队活动与每个人的求学、家庭、工作和既有隐秘职责共存。工作冲突须给出真实排期与可以选择的解决方式，例如换时段、分段录制或减少通告；不凭“热血”让所有人连续战斗、演出而无需休息，也不新增已经发生的退圈或失败经历。

      心之钢的演出能鼓舞实际听众面对失败、尝试新事物并寻求支持。普通表演不会自动恢复魔力、解除所有精神侵扰或改变角色关系。若某段演出配合已有法术或净化设施，只在实际覆盖与可处理的对象上产生结果。

      危机中可用排期调整、器材运输、物资协助和获准场地来支援城市。具体成员若承担守护任务，其缺席会影响排练和朋友关系，但不能仅为牵动玩家就不断制造败退、失联或绑架。玩家可以关心、协助后勤或继续避险。
  star_guardians:
    名称: 星之守护者
    类型: 守护者团体
    简介: 星之守护者以始源之星、星光及守护使命为背景，在普通生活之外承担保护居民和应对外敌的职责。小队能够存在队长、配合与行动分工，但全体守护者不因此属于一条已建立的城市统一指挥链。成员、力量宝石、伙伴及具体能力由个人资料确定。
    场所id: []
    已知成员: {}
    活动日程id: []
    规则: |-
      星之守护者以始源之星、星光及守护使命为背景，在普通生活之外承担保护居民和应对外敌的职责。小队能够存在队长、配合与行动分工，但全体守护者不因此属于一条已建立的城市统一指挥链。成员、力量宝石、伙伴及具体能力由个人资料确定。

      守护者仍然求学、工作、聚会和休息。公开身份与秘密使命分开；普通居民可以知道有人在救援，却未必知道其真名、小队和力量来源。关系较近也不自动获知全部秘密，消息须来自目击、当事人告知或实际获得的可靠情报。

      面对星光被吞噬、星之吞噬者活动及适用的宇宙威胁，守护者具有关注与应对的侧重。面对虚空通道、恶魔侵扰或其他已知危险，只要能抵达并有有效手段，也会救援、防守或协助专业人员。不同威胁的封印与净化方法仍分别判断。

      危机安排应说明谁获知、谁能到场、采取何种行动，以及实际结果。小队可以成功、受阻、受伤、撤退或求援；不能因“守护宿命”先判定全员悲剧结局，也不把正常恐惧自动写成堕落。保留墒增这一宇宙用词；其具体压力以光芒受损、防线失守和敌人行动呈现。

      玩家不是默认成员，可拒绝参战。朋友的行动和受伤会影响共同生活，但不代替玩家选择。组织与学院、绽灵秘会是否有联络暂不建立固定名单；现场获知同一危险后仍可临时合作。
  battle_academia:
    名称: 战斗学院体系
    类型: 独立学院体系（非统一机构）
    简介: 战斗学院是多所独立学校构成的教育与守护体系。杜朗德尔、莱布利斯和巴比隆分别招生、教学、管理学生与组织社团；它们不是一所学校的三个分院。其他学院也可能存在；当前展开的三校不构成全部学校名录。
    场所id:
      - university_university
    已知成员: {}
    活动日程id: []
    规则: |-
      战斗学院是多所独立学校构成的教育与守护体系。杜朗德尔、莱布利斯和巴比隆分别招生、教学、管理学生与组织社团；它们不是一所学校的三个分院。其他学院也可能存在；当前展开的三校不构成全部学校名录。

      各校共享悬空学院区现有地图点位表示的园区和接驳入口，保留各自的校内权限、传统和事务。共享接驳、公共活动区和获准使用的设施不等于共享学籍、学生档案或全部研究。进入共用园区与使用各项设施，分别遵守对应学校和场所的许可。

      神之武器拥有意志，择主与精神链接须依已有个人能力及实际仪式，不把学生身份等同于已经获选。授课、研究和搭档训练可以与普通社团、舞会和跨校赛事交错。学习过程不会凭一场校园活动自动授予玩家能力或装备。

      学院承担保护居民、调查已知异常与应对外敌的共同责任，侧重本地现场、武器研究及适用的技术和法术支援。不是全体学生自动出战：根据成员实际能力、训练、授权与现场条件安排教师、专业人员、志愿支援与保护学生。未知敌人须调查，不能统一按“本土异常”直接认定来源与弱点。

      外敌类型不构成拒绝救援的理由。星之吞噬者袭击城市时，能够有效支援的学院人员同样参与；关闭虚空通道、处置恶魔和安置居民是不同工作，可由有相应手段的人协作。
  durandal:
