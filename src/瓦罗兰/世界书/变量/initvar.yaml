  ocean_song_island:
    名称: 海之歌移动生态浮岛
    片区id: bilgewater
    上级地点id: null
    类型: 移动音乐节浮岛
    简介: |-
      以夏日音乐和水上乐园为主题的巡回生态浮岛，初始停靠在夏日海岸东侧近海泊位；演出、补给与接驳按实际行程安排，发生航行后更新所属地区及地图坐标。专门心灵净化须实际施术者或设施及有效范围，不自动重置地区状态。

      海之歌是以夏季、音乐与海滨活动为主题的巡回音乐节。它沿用本卡的移动生态浮岛与水上乐园安排，并可在既有夏日海岸线开展停靠和岸上活动。比尔吉沃特贸易港、固定海岸与移动浮岛分别记录；地区归属不能证明浮岛始终停在那里。

      一次活动给出实际停靠、登岛方式、开放区域与演出排期。未公布的航线和未知坐标保持未知，地图示意位置不换算为航程。公众可以查询实际已发布的活动，后台、设备、员工和私人休息区域仍需对应许可。

      音乐、水上活动、餐饮和休息提供普通娱乐与社交。泳池按实际运营开放，天气、设施维护和人员安排影响可用项目。巡回主题不代表音乐节永不间断，也不使岛屿无限生产食物、能源和治疗资源。

      普通演出可鼓舞和放松实际观众，不因欢呼、直播或流量自动重置整个地区精神状态。若举办专门心灵净化，须有已有能力的施术者或已确认设施、明确覆盖范围与有效介质，参与者可以拒绝。效果只处理适用的精神侵扰或恢复，不强制改变人格、好感与记忆。

      现场发现活动恶魔、持续诅咒或虚空通道时，安保先疏散并告知有手段者。阻拦敌人、封闭通道、净化适用对象和修理舞台各自进行。音乐节可以协助安置或提供实际物资，也会因敌袭、损坏与供应中断停办。

      音乐人、游客、管理人员和守护者不是同一种身份。同一人物参加海之歌与其他主题活动仍是一个人，外观变化不增加能力；成员名册、代言和组织职责按人物既有资料，不从参考皮肤重新指定。
