      启用: false
      查找表达式: '/(?:^|\n)<(update(?:variable)?)>\s*(?:<Analysis>[\s\S]*?<\/Analysis>\s*)?<JSONPatch>[\s\S]*?<\/JSONPatch>\s*<\/\1>\s*$/i'
      替换为: ""
